# ==============================================================================
# SkinWise AI - Production stack
# Launch with: docker-compose up --build
#   Frontend : http://localhost:5173   (nginx serving the React build)
#   Backend  : http://localhost:8000   (Swagger docs: /docs)
# For development with hot-reload, run the services without Docker (see README).
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    image: skinwise-backend:latest
    container_name: skinwise-backend
    ports:
      - "8000:8000"
    environment:
      - ONNX_MODEL_PATH=/app/backend/app/best_model.onnx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - skinwise-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        # The browser calls the API directly on the host's port 8000
        VITE_API_BASE_URL: http://localhost:8000
    image: skinwise-frontend:latest
    container_name: skinwise-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - skinwise-net
    restart: unless-stopped

networks:
  skinwise-net:
    driver: bridge
